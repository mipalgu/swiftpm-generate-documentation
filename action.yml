name: Generate Documentation
description: Generates a documentation website from a swift package.

inputs:
  output-path:
    description: The path containing the generated docs.
    required: false
    default: "./docs"
  working-directory:
    description: The directory containing the swift package.
    required: false
    default: ""
  hosting-base-path:
    description: The the website will be hosted.
    required: false
    default: ${{ github.event.repository.name }}
  minimum-access-level:
    description: The minimum access level that must be included in the docs.
    default: "public"
  swift-version:
    description: The version of Swift used to execute the docC package plugin.
    default: latest

runs:
  using: 'composite'

  steps:
      - name: Setup Swift on MacOS
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          curl -O https://download.swift.org/swiftly/darwin/swiftly.pkg && \
            installer -pkg swiftly.pkg -target CurrentUserHomeDirectory && \
            ~/.swiftly/bin/swiftly init --quiet-shell-followup --assume-yes && \
            . "${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh" && \
            hash -r

      - name: Setup Swift on Linux
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get -y install libcurl4-openssl-dev
          curl -O https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz && \
            tar zxf swiftly-$(uname -m).tar.gz && \
            ./swiftly init --quiet-shell-followup --assume-yes && \
            . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh" && \
            hash -r

      - name: Generate Documentation
        if: ${{ runner.os == 'Linux' }}
        run: swift $GITHUB_ACTION_PATH/src/main.swift --hosting-base-path ${{ inputs.hosting-base-path }} --output-path ${{ inputs.output-path }} --working-directory ${{ inputs.working-directory }} --minimum-access-level ${{ inputs.minimum-access-level }} --swift-bin "`which swift`"
        shell: bash
 
      - name: Generate Documentation
        if: ${{ runner.os == 'macOS' }}
        run: swift $GITHUB_ACTION_PATH/src/main.swift --hosting-base-path ${{ inputs.hosting-base-path }} --output-path ${{ inputs.output-path }} --working-directory ${{ inputs.working-directory }} --minimum-access-level ${{ inputs.minimum-access-level }} --swift-bin "`which swift`"
        shell: bash
